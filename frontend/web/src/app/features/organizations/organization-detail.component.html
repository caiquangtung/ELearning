    <p-button
      label="Back"
      icon="pi pi-arrow-left"
      [text]="true"
      routerLink="/organizations"
      styleClass="mb-3"
    />
    @if (loading()) {
      <p>Loading…</p>
    } @else {
      @if (detail(); as d) {
        <h1 class="text-2xl font-semibold mt-0">{{ d.organization.name }}</h1>
        <p class="text-color-secondary flex align-items-center gap-2 flex-wrap">
          <span>{{ d.organization.slug }}</span>
          <p-tag [value]="d.organization.status" severity="info" />
        </p>
        <div class="mb-3 flex flex-wrap gap-2 align-items-center">
          <a
            [routerLink]="[
              '/organizations',
              d.organization.id,
              'license-pools',
            ]"
            class="text-primary font-medium"
          >
            License pools
          </a>
          <p-button
            label="Add member"
            icon="pi pi-user-plus"
            severity="secondary"
            [outlined]="true"
            (onClick)="showAddMember = !showAddMember"
          />
        </div>
        <h2 class="text-xl">Members</h2>
        <p-table
          [value]="d.members"
          styleClass="p-datatable-sm mb-4"
          [tableStyle]="{ 'min-width': '40rem' }"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>User ID</th>
              <th>Role</th>
              <th>Joined</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-m>
            <tr>
              <td class="font-mono text-sm">{{ m.userId }}</td>
              <td>{{ m.orgRole }}</td>
              <td>{{ m.joinedAt | date: 'medium' }}</td>
            </tr>
          </ng-template>
        </p-table>
        @if (showAddMember) {
          <p-panel header="Add member" [toggleable]="true" styleClass="mb-4">
            <div
              class="flex flex-column md:flex-row flex-wrap gap-3 align-items-end"
            >
              <input
                pInputText
                [(ngModel)]="memberUserId"
                placeholder="User ID (GUID)"
                class="w-full md:w-25rem"
                name="uid"
              />
              <p-dropdown
                [options]="roleOptions"
                [(ngModel)]="memberOrgRole"
                optionLabel="label"
                optionValue="value"
                placeholder="Org role"
                appendTo="body"
                styleClass="w-full md:w-12rem"
                name="orgRole"
              />
              <p-button
                label="Add"
                icon="pi pi-user-plus"
                [disabled]="!memberUserId.trim() || adding()"
                [loading]="adding()"
                (onClick)="addMember()"
              />
            </div>
          </p-panel>
        }
      }
    }
