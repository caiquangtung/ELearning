    <div class="page">
      <div class="page-header">
        <div>
          <h1>Send announcement</h1>
          <p>Create an in-app announcement for selected recipients.</p>
        </div>
        <p-button
          label="Back"
          icon="pi pi-arrow-left"
          severity="secondary"
          [outlined]="true"
          routerLink="/notifications"
        />
      </div>

      <p-card>
        <form class="form" (ngSubmit)="submit()">
          @if (success(); as msg) {
            <p-message severity="success" [text]="msg" />
          }
          @if (error(); as msg) {
            <p-message severity="error" [text]="msg" />
          }

          <label>
            <span>Recipients</span>
            <textarea
              pInputTextarea
              rows="4"
              name="recipients"
              [(ngModel)]="recipientText"
              placeholder="One user ID per line"
              required
            ></textarea>
          </label>

          <div class="grid">
            <label>
              <span>Scope</span>
              <p-dropdown
                name="scope"
                [options]="scopeOptions"
                [(ngModel)]="scope"
                optionLabel="label"
                optionValue="value"
                appendTo="body"
              />
            </label>
            <label>
              <span>Action URL</span>
              <input
                pInputText
                name="actionUrl"
                [(ngModel)]="actionUrl"
                placeholder="/courses"
              />
            </label>
          </div>

          <label>
            <span>Subject</span>
            <input
              pInputText
              name="subject"
              [(ngModel)]="subject"
              maxlength="200"
              required
            />
          </label>

          <label>
            <span>Body</span>
            <textarea
              pInputTextarea
              rows="6"
              name="body"
              [(ngModel)]="body"
              maxlength="4000"
              required
            ></textarea>
          </label>

          <div class="footer">
            <p-button
              type="submit"
              label="Send"
              icon="pi pi-send"
              [disabled]="submitting()"
            />
          </div>
        </form>
      </p-card>
    </div>
