upstream elearning_api {
    least_conn;
    server api-1:8080 max_fails=3 fail_timeout=10s;
    server api-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream elearning_web {
    server web-1:80 max_fails=3 fail_timeout=10s;
    server web-2:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/elearning
    levels=1:2
    keys_zone=elearning_static:50m
    max_size=2g
    inactive=7d
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://elearning_api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        proxy_pass http://elearning_web;
        proxy_cache elearning_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://elearning_web;
        add_header Cache-Control "no-cache";
    }
}
