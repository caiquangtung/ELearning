    @if (pool(); as p) {
      <app-page-shell title="{{ p.name }}" [subtitle]="'Pool: ' + p.id">
        <ng-container pageActions>
          <app-ui-button
            label="Refresh"
            icon="pi pi-refresh"
            severity="secondary"
            [text]="true"
            (clicked)="reload()"
          />
          @if (p.seatPriceCents > 0) {
            <p-button
              label="Buy seats"
              icon="pi pi-shopping-cart"
              [routerLink]="['/checkout']"
              [queryParams]="{ type: 'LicensePool', ref: p.id, qty: 1 }"
            />
          }
        </ng-container>

        <div class="flex gap-3 flex-wrap mb-3">
          <p-tag
            [value]="p.activeSeats + ' / ' + p.totalSeats + ' used'"
            severity="info"
          />
          <p-tag
            [value]="p.availableSeats + ' available'"
            [severity]="p.availableSeats > 0 ? 'success' : 'danger'"
          />
          <span class="text-600 text-sm"
            >Created: {{ p.createdAt | date: 'medium' }}</span
          >
        </div>

        <div class="mb-3">
          <p-button
            label="Assign license"
            icon="pi pi-user-plus"
            severity="secondary"
            [outlined]="true"
            (onClick)="showAssignForm = !showAssignForm"
          />
        </div>

        @if (showAssignForm) {
          <p-panel
            header="Assign license"
            [toggleable]="true"
            styleClass="mb-4"
          >
            <div class="flex flex-column gap-3" style="max-width: 36rem">
              <input
                pInputText
                [(ngModel)]="userId"
                placeholder="User ID (GUID)"
                class="w-full"
                name="lpuserid"
              />
              <app-ui-button
                label="Assign"
                icon="pi pi-user-plus"
                [disabled]="!userId.trim() || assigning()"
                [loading]="assigning()"
                (clicked)="assign()"
              />
            </div>
          </p-panel>
        }

        <app-ui-data-table
          [value]="p.assignments"
          [emptyColspan]="4"
          [showPaginator]="false"
          [tableStyle]="{ 'min-width': '52rem' }"
        >
          <ng-template uiDataTableHeader>
            <tr>
              <th>User</th>
              <th>Assigned</th>
              <th>Status</th>
              <th></th>
            </tr>
          </ng-template>

          <ng-template uiDataTableBody let-a>
            <tr>
              <td class="font-mono text-sm">{{ a.userId }}</td>
              <td>{{ a.assignedAt | date: 'medium' }}</td>
              <td>
                <p-tag
                  [value]="a.revokedAt ? 'Revoked' : 'Active'"
                  [severity]="a.revokedAt ? 'secondary' : 'success'"
                />
              </td>
              <td class="text-right">
                @if (!a.revokedAt) {
                  <app-ui-button
                    label="Revoke"
                    icon="pi pi-ban"
                    severity="danger"
                    [text]="true"
                    [loading]="revokingUserId() === a.userId"
                    (clicked)="revoke(a.userId)"
                  />
                }
              </td>
            </tr>
          </ng-template>
        </app-ui-data-table>
      </app-page-shell>
    }
